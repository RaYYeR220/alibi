notes: >
  The free flagship case, 20 to 30 minutes. A family heirloom goes missing from the cabin during the party:
  no murder, nobody hurt. It must show every mechanic: plain small talk, a guarded fact that needs a second
  push, at least two locked facts, at least two lies that crack when shown the right clue, one clue sent to
  the lab with results 14 hours later, a red herring who looks guilty for a while, and a minimal proof of
  exactly two clues. Funny and warm; each suspect sounds different.
