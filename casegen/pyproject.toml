[project]
name = "alibi-casegen"
version = "0.1.0"
description = "Case generation pipeline and prover for Alibi"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "strands-agents[openai]>=1.61.1",
  "bedrock-agentcore>=1.24.2",
  "z3-solver>=5.3.1",
  "pydantic>=2.9",
  "boto3>=1.40",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.scripts]
alibi-validate = "alibi_casegen.cli:validate_main"
alibi-generate = "alibi_casegen.cli:generate_main"
alibi-media = "alibi_casegen.media:media_main"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alibi_casegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
